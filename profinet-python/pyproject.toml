[project]
name = "profinet-mcp"
version = "0.2.0"
description = "MCP server for PROFINET IO: DCP discovery, GSDML parsing, and a full tool set against a mock IO device."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents" }]
dependencies = [
    "anyio>=4.0.0",
    "mcp[cli]>=1.22.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.1.0",
    "scapy>=2.5.0",
    "lxml>=4.9.0",
]

[project.urls]
Repository = "https://github.com/IndustriAgents/PROFINET-MCP"
Issues = "https://github.com/IndustriAgents/PROFINET-MCP/issues"

[project.scripts]
profinet-mcp = "profinet_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    # The integration tests run ../profinet-mock-server in this environment.
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: starts the mock IO device and the MCP server as subprocesses"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
