[project]
name = "profinet-mock-server"
version = "0.2.0"
description = "Mock PROFINET IO device (JSON over TCP) for MCP integration tests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents" }]
dependencies = [
    "rich>=13.7.0",
    "python-dotenv>=1.1.0",
]

[project.urls]
Repository = "https://github.com/IndustriAgents/PROFINET-MCP"
Issues = "https://github.com/IndustriAgents/PROFINET-MCP/issues"

[project.scripts]
profinet-mock-server = "profinet_mock_device:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
  "profinet_mock_device.py",
  "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "profinet_mock_device.py",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
