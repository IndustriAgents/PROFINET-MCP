name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything here runs without PROFINET hardware and without raw-socket
# privileges: the server's tests drive the mock IO device (started as a
# subprocess on an OS-assigned local port) and use fake layer-2 transports
# for DCP, so no raw socket is ever opened.
jobs:
  server:
    name: MCP server (profinet-python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profinet-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q src

      - name: Import package
        run: uv run --no-sync python -c "import profinet_mcp, profinet_mcp.cli, profinet_mcp.server, profinet_mcp.tools, profinet_mcp.pn_client, profinet_mcp.backends, profinet_mcp.dcp, profinet_mcp.gsd_parser"

      - name: Console entry point
        run: uv run --no-sync profinet-mcp --help

      # Unit tests plus integration tests that start ../profinet-mock-server
      # and drive the real MCP server over stdio with the MCP client SDK.
      - name: Tests
        run: uv run --no-sync pytest -v

  mock:
    name: Mock IO device (profinet-mock-server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: profinet-mock-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Byte-compile sources
        run: uv run --no-sync python -m compileall -q profinet_mock_device.py

      - name: Import module
        run: uv run --no-sync python -c "import profinet_mock_device"

      - name: Console entry point
        run: uv run --no-sync profinet-mock-server --help

      # Request validation, the DCP-style operations, devices files, .env
      # loading and a TCP JSON-lines round trip on an ephemeral port.
      - name: Tests
        run: uv run --no-sync pytest -v
